[package]
name = "fx-line"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "libc",
    "objc2-core-foundation",
    "std",
    "NSApplication",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAutoreleasePool",
    "NSGeometry",
    "NSObject",
    "NSString",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
