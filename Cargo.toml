[package]
name = "fx-line"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
